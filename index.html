
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SmartInvoice AI</title>
    <meta name="description" content="AI-powered invoice generation and management application">
    <meta name="theme-color" content="#3b82f6">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f9fafb;
            overflow-x: hidden;
        }
        .invoice-preview-shell {
            display: flex;
            justify-content: center;
        }
        #printable-invoice {
            width: 100%;
            max-width: 190mm;
            min-width: 0;
            box-sizing: border-box;
        }
        @media screen and (max-width: 640px) {
            .invoice-preview-shell {
                display: block;
                overflow-x: auto;
                overflow-y: hidden;
                -webkit-overflow-scrolling: touch;
            }
            #printable-invoice {
                width: 100% !important;
                max-width: none !important;
                min-width: 0 !important;
                font-size: 11px !important;
            }
            #printable-invoice h1 {
                font-size: 18px !important;
                white-space: nowrap !important;
            }
            #printable-invoice .invoice-items-table {
                width: 640px !important;
                min-width: 640px !important;
                table-layout: fixed !important;
            }
            #printable-invoice .items-wrapper {
                min-width: 0 !important;
                overflow-x: auto !important;
            }
            #printable-invoice .invoice-items-spacer {
                min-width: 640px !important;
            }
            #printable-invoice .invoice-items-table .invoice-col-sno {
                width: 44px !important;
            }
            #printable-invoice .invoice-items-table .invoice-col-description {
                width: 220px !important;
            }
            #printable-invoice .invoice-items-table .invoice-col-hsn {
                width: 90px !important;
            }
            #printable-invoice .invoice-items-table .invoice-col-qty {
                width: 55px !important;
            }
            #printable-invoice .invoice-items-table .invoice-col-rate {
                width: 110px !important;
            }
            #printable-invoice .invoice-items-table .invoice-col-amount {
                width: 121px !important;
            }
            #printable-invoice .invoice-description-header,
            #printable-invoice .invoice-description-cell {
                border-right: 1px solid #000 !important;
                width: 220px !important;
                min-width: 220px !important;
                max-width: 220px !important;
                overflow-wrap: anywhere !important;
                word-break: break-word !important;
            }
            #printable-invoice .invoice-hsn-header,
            #printable-invoice .invoice-hsn-cell {
                border-left: 1px solid #000 !important;
                border-right: 1px solid #000 !important;
                width: 90px !important;
                min-width: 90px !important;
                max-width: 90px !important;
                overflow-wrap: anywhere !important;
                word-break: break-word !important;
                white-space: normal !important;
            }
        }
        @media print {
            .no-print {
                display: none !important;
            }
            .print-only {
                display: block !important;
            }
            html, body, #root {
                background: white;
                margin: 0;
                padding: 0;
                height: auto !important;
                min-height: 0 !important;
                overflow: visible !important;
            }
            .min-h-screen, main, .container, .flex-col {
                min-height: 0 !important;
                margin: 0 !important;
                padding: 0 !important;
                max-width: none !important;
            }
            main {
                display: block !important;
                height: auto !important;
                flex: none !important;
                overflow: visible !important;
            }
            #root > div {
                display: block !important;
                height: auto !important;
                min-height: 0 !important;
                flex: none !important;
                overflow: visible !important;
            }
            #root > div > nav,
            #root > div > input,
            #root > div > .no-print {
                display: none !important;
            }
            @page {
                size: A4 portrait;
                margin: 10mm;
            }
            @page receivables {
                size: A4 landscape;
                margin: 6mm;
            }
            #printable-invoice {
                width: 190mm !important;
                height: 277mm !important;
                min-height: 277mm !important;
                max-height: 277mm !important;
                margin: 0 auto !important;
                padding: 0 !important;
                border: 1px solid black !important;
                border-radius: 0 !important;
                box-shadow: none !important;
                overflow: hidden !important;
                box-sizing: border-box !important;
                page-break-after: avoid !important;
                break-after: avoid-page !important;
                display: flex !important;
                flex-direction: column !important;
                font-size: 10pt !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
            #printable-invoice .items-wrapper {
                flex: 1 1 auto !important;
                display: flex !important;
                flex-direction: column !important;
            }
            #printable-invoice .items-spacer {
                flex: 1 1 auto !important;
            }
            #printable-statement {
                page: receivables;
                background: white !important;
                padding: 0 !important;
                margin: 0 !important;
                max-width: none !important;
                width: 100% !important;
                height: auto !important;
                min-height: 0 !important;
                overflow: visible !important;
                font-family: Arial, Helvetica, sans-serif !important;
                font-size: 11pt !important;
                line-height: 1.2 !important;
                break-after: auto !important;
                page-break-after: auto !important;
                break-before: auto !important;
                page-break-before: auto !important;
                page-break-inside: auto !important;
                break-inside: auto !important;
                margin-bottom: 0 !important;
            }
            #printable-statement .receivables-mobile-cards {
                display: none !important;
            }
            #printable-statement .receivables-desktop-table {
                display: block !important;
                overflow: visible !important;
            }
            #printable-statement::after {
                content: none !important;
                display: none !important;
            }
            #printable-statement .space-y-6,
            #printable-statement .space-y-4 {
                gap: 2px !important;
            }
            #printable-statement .p-4 {
                padding: 6px !important;
            }
            #printable-statement .mt-4 {
                margin-top: 6px !important;
            }
            #printable-statement h2 {
                font-size: 20pt !important;
                line-height: 1.2 !important;
                letter-spacing: 0.2pt !important;
            }
            #printable-statement h3 {
                font-size: 14pt !important;
                line-height: 1.2 !important;
            }
            #printable-statement .grid {
                gap: 6px !important;
            }
            #printable-statement .lg\:grid-cols-5 {
                grid-template-columns: repeat(5, minmax(0, 1fr)) !important;
            }
            #printable-statement .no-print {
                display: none !important;
            }
            #printable-statement .no-print-status {
                display: none !important;
                visibility: collapse !important;
                width: 0 !important;
                max-width: 0 !important;
                min-width: 0 !important;
                padding: 0 !important;
                border: 0 !important;
            }
            #printable-statement .statement-status-cell {
                display: none !important;
                visibility: hidden !important;
                width: 0 !important;
                padding: 0 !important;
                border: 0 !important;
            }
            #printable-statement col.no-print-status {
                display: none !important;
                visibility: collapse !important;
                width: 0 !important;
            }
            #printable-statement thead th:last-child,
            #printable-statement tbody td:last-child {
                display: none !important;
                visibility: collapse !important;
                width: 0 !important;
                padding: 0 !important;
                border: 0 !important;
            }
            #printable-statement table {
                width: 100% !important;
                border-collapse: collapse !important;
                table-layout: fixed !important;
                min-width: 0 !important;
                font-size: 10.5pt !important;
            }
            #printable-statement .statement-invoice-col { width: 7%; }
            #printable-statement .statement-date-col { width: 9%; }
            #printable-statement .statement-receiver-col { width: 20%; }
            #printable-statement .statement-money-col { width: 9%; }
            #printable-statement .statement-received-col { width: 13%; }
            #printable-statement .statement-status-col { width: 7%; }
            #printable-statement th,
            #printable-statement td {
                border: 1px solid #94a3b8 !important;
                border-left: 1px solid #64748b !important;
                border-right: 1px solid #64748b !important;
                padding: 5px 6px !important;
                line-height: 1.2 !important;
                vertical-align: top !important;
                min-width: 0 !important;
                overflow-wrap: anywhere !important;
                word-break: break-word !important;
                white-space: normal !important;
            }
            #printable-statement thead {
                display: table-header-group !important;
            }
            #printable-statement thead tr {
                background: #e2e8f0 !important;
                color: #0f172a !important;
            }
            #printable-statement thead th {
                font-size: 10pt !important;
                font-weight: 700 !important;
                letter-spacing: 0.3pt !important;
                text-transform: uppercase !important;
                white-space: nowrap !important;
            }
            #printable-statement tbody tr:nth-child(even) {
                background: #f8fafc !important;
            }
            #printable-statement tbody tr {
                border-top: 1px solid #cbd5e1 !important;
                border-bottom: 1px solid #cbd5e1 !important;
            }
            #printable-statement tbody tr + tr {
                border-top: 1px solid #94a3b8 !important;
            }
            #printable-statement th:nth-child(n+4),
            #printable-statement td:nth-child(n+4) {
                font-size: 9pt !important;
            }
            #printable-statement td:nth-child(1),
            #printable-statement td:nth-child(2),
            #printable-statement td:nth-child(4),
            #printable-statement td:nth-child(5),
            #printable-statement td:nth-child(6),
            #printable-statement td:nth-child(7),
            #printable-statement td:nth-child(8),
            #printable-statement td:nth-child(9) {
                white-space: nowrap !important;
                overflow-wrap: normal !important;
                word-break: normal !important;
            }
            #printable-statement td:nth-child(2) {
                font-weight: 700 !important;
            }
            #printable-statement td:nth-child(7) {
                white-space: normal !important;
                overflow-wrap: normal !important;
                word-break: normal !important;
            }
            #printable-statement .statement-received-print {
                display: block !important;
                white-space: normal !important;
            }
            #printable-statement .statement-receipt-line {
                display: block !important;
                white-space: nowrap !important;
            }
            #printable-statement tr {
                break-inside: avoid !important;
                page-break-inside: avoid !important;
            }
            #printable-statement .rounded-xl {
                border-radius: 0 !important;
            }
            #printable-statement .text-xs {
                font-size: 8.5pt !important;
            }
            #printable-statement > *:last-child {
                break-after: auto !important;
                page-break-after: auto !important;
            }
            #printable-statement col.statement-status-col {
                display: table-column !important;
                visibility: visible !important;
            }
            #printable-statement .statement-status-cell,
            #printable-statement .no-print-status,
            #printable-statement thead th:last-child,
            #printable-statement tbody td:last-child {
                display: table-cell !important;
                visibility: visible !important;
                width: auto !important;
                max-width: none !important;
                min-width: 0 !important;
                padding: 5px 6px !important;
                border: 1px solid #64748b !important;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
